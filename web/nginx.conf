server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # nginx escucha en el 80 dentro del contenedor, pero el puerto publicado en
  # el host es otro (5173 por defecto, configurable). Sin esto, cualquier
  # redirección que nginx genere sale como `http://localhost/...`, con SU
  # puerto y no el publicado, y el navegador acaba en el 80 del host.
  # Relativa, la resuelve el navegador contra el origen que ya tiene.
  absolute_redirect off;

  # `add_header` NO se hereda en un `location` que declara los suyos: nginx
  # reemplaza el conjunto entero en vez de fusionarlo. Por eso estas tres van
  # repetidas abajo en cada bloque que añade cabeceras propias.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # SPA: cualquier ruta desconocida devuelve el index, no un 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los assets llevan hash en el nombre, así que cachearlos un año es seguro.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
  }

  # El index NO se cachea: es quien apunta a los assets con hash, y una copia
  # vieja serviría rutas de un build anterior.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
  }

  # El navegador siempre pide a `/api`, una ruta relativa del mismo origen.
  # Aquí se reenvía al servicio `api` de Compose. Sin esto habría que
  # configurar CORS y exponer la URL del backend en el bundle.
  #
  # Sin barra final a propósito: con `location /api/`, una petición a `/api`
  # a secas no entraba aquí, caía en el `try_files` de arriba y terminaba en
  # una redirección con el puerto equivocado. Así `/api` llega a Express igual
  # que si se pidiera al puerto de la API, y las dos puertas responden lo mismo.
  location /api {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    # `$http_host` conserva el puerto que escribió el cliente; `$host` no.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
