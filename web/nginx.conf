server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta desconocida devuelve el index, no un 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # El navegador siempre pide a `/api`, una ruta relativa del mismo origen.
  # Aquí se reenvía al servicio `api` de Compose. Sin esto habría que
  # configurar CORS y exponer la URL del backend en el bundle.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
